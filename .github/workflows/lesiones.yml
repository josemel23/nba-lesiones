name: Actualizar lesiones NBA

on:
  schedule:
    # 11:17 a. m. y 3:17 p. m. hora de Colombia (16:17 y 20:17 UTC)
    - cron: "17 16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scrape.js
      - name: Enriquecer (stats y regresos)
        run: node enriquecer.js
      - name: Guardar archivos si cambiaron
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add lesiones.json regresos.json estado-lesiones.json
          git diff --cached --quiet || (git commit -m "Actualizar lesiones" && git push)
